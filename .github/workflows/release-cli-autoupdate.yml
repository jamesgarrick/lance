name: release-cli-autoupdate

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Detect CLI version change
        id: cli_changed
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^packages/cli/package.json$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build CLI
        if: steps.cli_changed.outputs.changed == 'true'
        working-directory: packages/cli
        run: bun run build

      - name: Ensure shrinkwrap file exists for oclif pack
        if: steps.cli_changed.outputs.changed == 'true'
        working-directory: packages/cli
        run: |
          if [ ! -f npm-shrinkwrap.json ]; then
            cat > npm-shrinkwrap.json <<'EOF'
          {
            "name": "@lance/cli",
            "lockfileVersion": 3,
            "requires": true,
            "packages": {
              "": {}
            }
          }
          EOF
          fi

      - name: Pack Oclif tarballs
        if: steps.cli_changed.outputs.changed == 'true'
        working-directory: packages/cli
        run: bunx oclif pack tarballs --root . --targets linux-x64,linux-arm64,darwin-x64,darwin-arm64,win32-x64

      - name: Verify release artifacts exist
        if: steps.cli_changed.outputs.changed == 'true'
        run: |
          ls -la packages/cli/dist
          find packages/cli/dist -type f | sort
          count="$(find packages/cli/dist -type f | wc -l | tr -d ' ')"
          if [ "$count" = "0" ]; then
            echo "No CLI artifacts produced in packages/cli/dist"
            exit 1
          fi

      - name: Resolve release tag
        if: steps.cli_changed.outputs.changed == 'true'
        id: release_tag
        run: |
          VERSION="$(node -p "require('./packages/cli/package.json').version")"
          echo "tag=@lance/cli@${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with tarballs
        if: steps.cli_changed.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: |
            packages/cli/dist/*.tar.gz
