name: release-cli-autoupdate

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Detect CLI version change
        id: cli_changed
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^packages/cli/package.json$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build CLI
        if: steps.cli_changed.outputs.changed == 'true'
        working-directory: packages/cli
        run: bun run build

      - name: Ensure shrinkwrap file exists for oclif pack
        if: steps.cli_changed.outputs.changed == 'true'
        working-directory: packages/cli
        run: |
          if [ ! -f npm-shrinkwrap.json ]; then
            cat > npm-shrinkwrap.json <<'EOF'
          {
            "name": "@lance/cli",
            "lockfileVersion": 3,
            "requires": true,
            "packages": {
              "": {}
            }
          }
          EOF
          fi

      - name: Pack Oclif tarballs
        if: steps.cli_changed.outputs.changed == 'true'
        working-directory: packages/cli
        run: bunx oclif pack tarballs --root . --targets linux-x64,linux-arm64,darwin-x64,darwin-arm64,win32-x64

      - name: Verify release artifacts exist
        if: steps.cli_changed.outputs.changed == 'true'
        run: |
          ls -la packages/cli/dist
          find packages/cli/dist -type f | sort
          count="$(find packages/cli/dist -type f | wc -l | tr -d ' ')"
          if [ "$count" = "0" ]; then
            echo "No CLI artifacts produced in packages/cli/dist"
            exit 1
          fi

      - name: Generate install index
        if: steps.cli_changed.outputs.changed == 'true'
        working-directory: packages/cli
        run: |
          export VERSION="$(bun -p "require('./package.json').version")"
          node <<'EOF'
          const fs = require("fs");
          const path = require("path");
          const distDir = path.resolve("dist");
          const files = fs.readdirSync(distDir).filter((f) => f.endsWith(".tar.gz"));
          const targets = ["linux-x64", "linux-arm64", "darwin-x64", "darwin-arm64", "win32-x64"];
          const tarballs = {};
          for (const target of targets) {
            const match = files.find((f) => f.includes(`-${target}.tar.gz`));
            if (match) tarballs[target] = match;
          }
          const version = process.env.VERSION;
          const out = {
            name: "@lance/cli",
            version,
            generatedAt: new Date().toISOString(),
            tarballs,
          };
          fs.writeFileSync(path.join(distDir, "install-index.json"), JSON.stringify(out, null, 2));
          EOF

      - name: Setup GitHub Pages
        if: steps.cli_changed.outputs.changed == 'true'
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        if: steps.cli_changed.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/cli/dist

      - name: Deploy to GitHub Pages
        if: steps.cli_changed.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Resolve release tag
        if: steps.cli_changed.outputs.changed == 'true'
        id: release_tag
        run: |
          VERSION="$(bun -p "require('./packages/cli/package.json').version")"
          echo "tag=@lance/cli@${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with tarballs
        if: steps.cli_changed.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: |
            packages/cli/dist/*.tar.gz
