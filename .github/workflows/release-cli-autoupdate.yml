name: release-cli-autoupdate

on:
  push:
    tags:
      - "@lance/cli@*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Validate tag matches CLI version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#@lance/cli@}"
          PKG_VERSION="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($VERSION) does not match packages/cli/package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Build standalone CLI binaries
        working-directory: packages/cli
        run: |
          mkdir -p dist/bin
          for target in bun-linux-x64 bun-linux-arm64 bun-darwin-x64 bun-darwin-arm64 bun-windows-x64; do
            out="dist/bin/lance-${target}"
            if [ "$target" = "bun-windows-x64" ]; then
              out="${out}.exe"
            fi
            bun build ./bin/lance.ts --compile --target="$target" --outfile "$out"
          done

      - name: Pack release tarballs
        working-directory: packages/cli
        run: |
          mkdir -p dist/releases
          for target in bun-linux-x64 bun-linux-arm64 bun-darwin-x64 bun-darwin-arm64 bun-windows-x64; do
            stage="dist/stage/$target/bin"
            mkdir -p "$stage"
            if [ "$target" = "bun-windows-x64" ]; then
              cp "dist/bin/lance-${target}.exe" "$stage/lance.exe"
            else
              cp "dist/bin/lance-${target}" "$stage/lance"
            fi
            tar -C "dist/stage/$target" -czf "dist/releases/lance-${target}.tar.gz" .
          done

      - name: Verify release artifacts exist
        run: |
          ls -la packages/cli/dist
          find packages/cli/dist -type f | sort
          count="$(find packages/cli/dist -type f | wc -l | tr -d ' ')"
          if [ "$count" = "0" ]; then
            echo "No CLI artifacts produced in packages/cli/dist"
            exit 1
          fi

      - name: Publish GitHub Release with tarballs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            packages/cli/dist/releases/*.tar.gz
