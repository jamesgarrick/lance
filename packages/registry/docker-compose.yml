services:
  registry:
    build:
      context: ../..
      dockerfile: packages/registry/Dockerfile
    environment:
      PORT: "8787"
      DATABASE_URL: "postgres://postgres:dev@postgres:5432/lance"
      LANCE_JWT_SECRET: "change-me-in-production"
    expose: ["8787"]
    networks:
      - dokploy-network
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    expose: ["5432"]
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: lance
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lance"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - dokploy-network
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

networks:
  dokploy-network:
    external: true
