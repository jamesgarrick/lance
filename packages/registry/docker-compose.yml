services:
  postgres:
    image: postgres:16
    expose: ["5432"]
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: lance
  minio:
    image: minio/minio
    expose: ["9000", "9001"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
