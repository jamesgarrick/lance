services:
  registry:
    build:
      context: ../..
      dockerfile: packages/registry/Dockerfile
    environment:
      PORT: "8787"
      DATABASE_URL: "postgres://postgres:dev@postgres:5432/lance"
      S3_BUCKET: "lance"
      S3_ACCESS_KEY_ID: "minioadmin"
      S3_SECRET_ACCESS_KEY: "minioadmin"
      S3_ENDPOINT: "http://minio:9000"
      S3_REGION: "us-east-1"
      LANCE_JWT_SECRET: "change-me-in-production"
    expose: ["8787"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  postgres:
    image: postgres:16
    expose: ["5432"]
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: lance
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lance"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio
    expose: ["9000", "9001"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q -O /dev/null http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - minio-data:/data

volumes:
  pgdata:
  minio-data:
